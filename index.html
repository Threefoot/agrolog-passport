<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anthea – Ψηφιακό διαβατήριο παρτίδας</title>
<style>
  :root { --bg:#f6f7f4; --card:#fff; --ink:#1d2b20; --mute:#5b6b5f; --acc:#2f6b3b; --warn:#b45309; --line:#dfe5dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121712; --card:#1b231c; --ink:#e8efe8; --mute:#9fb0a2; --acc:#7fcf8e; --warn:#f0a85a; --line:#2c372d; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 2px; }
  h2 { font-size:1.05rem; margin:0 0 8px; color:var(--acc); }
  .lot { color:var(--mute); margin:0 0 16px; font-variant-numeric:tabular-nums; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:0 0 12px; }
  dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 14px; }
  dt { color:var(--mute); } dd { margin:0; text-align:right; word-break:break-word; }
  ul { margin:0; padding:0; list-style:none; }
  li { padding:8px 0; border-top:1px solid var(--line); } li:first-child { border-top:0; }
  .sub { color:var(--mute); font-size:.9rem; }
  .ok { color:var(--acc); font-weight:600; } .bad { color:var(--warn); font-weight:600; }
  .msg { text-align:center; padding:48px 8px; color:var(--mute); }
  footer { text-align:center; color:var(--mute); font-size:.8rem; padding:16px 0 32px; }
  .lang { float:right; }
  .lang button { background:none; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:2px 10px; cursor:pointer; }
</style>
